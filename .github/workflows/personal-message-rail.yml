name: Personal message rail checks

on:
  push:
    branches: [ci/expand-chat-message-rail]
    paths-ignore: [.github/workflows/personal-message-rail.yml]
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, windows, macos]
      repository_checks:
        type: boolean
        default: true
      repository_commands:
        type: string
        default: '["lint","typecheck","build"]'

permissions:
  contents: read

concurrency:
  group: personal-message-rail-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_CODE_QUALITY_BASE: 8a10dd371c771f23546f025b6315920bf95fd025

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || inputs.platform == 'macos' && '["macos-15"]' || '["ubuntu-24.04","macos-15","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          node-version: '24'
      - name: Lint and format
        run: |
          pnpm exec oxlint src/renderer/src/components/native-chat/viewport/rail/NativeChatMessageRail.tsx src/renderer/src/components/native-chat/viewport/rail/NativeChatMessageRail.test.tsx src/renderer/src/components/native-chat/viewport/rail/NativeChatMessageRail.fixture.tsx
          pnpm exec oxfmt --check src/renderer/src/components/native-chat/viewport/rail/NativeChatMessageRail.tsx src/renderer/src/components/native-chat/viewport/rail/NativeChatMessageRail.test.tsx src/renderer/src/components/native-chat/viewport/rail/NativeChatMessageRail.fixture.tsx src/renderer/src/i18n/locales/en.json src/renderer/src/i18n/locales/zh.json docs/site/content/docs/agents/native-chat.mdx
      - name: Message rail tests
        run: pnpm test src/renderer/src/components/native-chat/viewport/rail src/renderer/src/components/native-chat/viewport/navigation src/renderer/src/components/virtualized-list.test.tsx --maxWorkers=2
      - name: Renderer typecheck
        run: pnpm tc:web
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Changed-code quality against the merged upstream base
        run: pnpm check:code-quality:changed 8a10dd371c771f23546f025b6315920bf95fd025
      - name: Install headless browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Rendered directory navigation and long-history check
        run: node config/scripts/component-fixtures/personal-message-rail.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: message-rail-proof-${{ runner.os }}
          path: message-rail-proof/
          retention-days: 7

  repository-checks:
    if: github.event_name != 'workflow_dispatch' || inputs.repository_checks
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(inputs.repository_commands || '["lint","typecheck","build"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Prepare workspace packages
        run: pnpm run build:packages
      - name: Run full repository command
        run: pnpm run ${{ matrix.command }}
